[bumpversion]
current_version = 2.0.0

[coverage:run]
# The integration is what needs measuring, not the test suite. Measuring
# `tests` made every run report ~100% regardless of what the integration
# code actually did, which is why this never caught anything.
source =
        custom_components/heating_curve_optimizer

[coverage:report]
exclude_lines =
	pragma: no cover
	raise NotImplemented()
	if __name__ == '__main__':
	main()
show_missing = true
# Baseline measured 2026-09 with `source` fixed above: 48%. This floor is a
# regression guard, not a target - raise it as coverage genuinely improves
# (see docs/redesign/REDESIGN.md phase 6). It is deliberately far below
# battery_controller's 90%: that number reflects years of work this
# integration has not had yet, and claiming it here would be the same
# unverified claim the redesign plan flagged for quality_scale: silver.
fail_under = 45

[tool:pytest]
testpaths = tests
norecursedirs = .git
pythonpath = .
asyncio_default_fixture_loop_scope = function
asyncio_mode = auto
# --maxfail is deliberately absent: stopping at the first failure hides
# every other failure behind it in CI. Add -x locally for fail-fast.
addopts =
        --disable-warnings -q
        -p syrupy
        --strict

# A coroutine that is never awaited silently does nothing - that is a bug,
# not a note. --disable-warnings above only hides the summary, so this class
# of bug could sit in the suite unnoticed. Promoting it to an error works
# even with that flag, because an error filter raises rather than reports.
filterwarnings =
        error:coroutine .* was never awaited:RuntimeWarning

[flake8]
max-line-length = 88
ignore = 
	E501,
	W503,
	E203,
	D202,
	W504

[isort]
multi_line_output = 3
include_trailing_comma = True
force_grid_wrap = 0
use_parentheses = True
line_length = 88
indent = "    "
not_skip = __init__.py
force_sort_within_sections = true
sections = FUTURE,STDLIB,INBETWEENS,THIRDPARTY,FIRSTPARTY,LOCALFOLDER
default_section = THIRDPARTY
known_first_party = custom_components,tests
forced_separate = tests
combine_as_imports = true

[mypy]
python_version = 3.13
# Matches battery_controller's `strict = true`. custom_components/ is fully
# mypy --strict clean (see docs/redesign/REDESIGN.md); a handful of genuine
# HA-boundary sites carry narrowly-scoped `# type: ignore[...]` comments for
# a confirmed environment limitation (this env's pinned HA 2024.3.3 ships no
# py.typed marker), not for code this repo controls.
strict = true
ignore_errors = false
follow_imports = silent
ignore_missing_imports = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_unused_configs = true
