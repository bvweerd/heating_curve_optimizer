name: CI

on:
  push:
    # main is included because releases are tagged from it, and release.yml
    # builds the shipped ZIP from that tag. Without main here, the commit that
    # reaches users would be one no job ever ran against.
    branches: ["main", "dev", "feature/**", "fix/**", "hotfix/**"]
    tags-ignore: ["**"]
  pull_request:
    branches: [dev, main]
  # pytest-homeassistant-custom-component is deliberately unpinned, so the
  # suite tracks whatever Home Assistant is current. That means a Home
  # Assistant release can break this integration without anyone touching the
  # repository — the weekly run surfaces it instead of the next contributor.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install pre-commit mypy -r requirements.txt

      - name: Cache pre-commit hooks
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        run: pre-commit run --all-files

      - name: Run mypy
        run: mypy custom_components/heating_curve_optimizer/

  test:
    # Home Assistant's supported Python floor decides which Home Assistant
    # version pip can install. Testing only on 3.13 validates against
    # whatever Home Assistant that resolves to, without saying so anywhere.
    #
    # 3.14 is kept alongside it so a newer supported Home Assistant line
    # doesn't silently start failing here first.
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Which Home Assistant a green run actually proves compatibility with is
      # otherwise invisible, since the dependency is unpinned by design.
      - name: Report the resolved Home Assistant version
        run: |
          HA_VERSION=$(pip show homeassistant | awk '/^Version:/ {print $2}')
          echo "Python ${{ matrix.python-version }} resolved Home Assistant $HA_VERSION"
          {
            echo "### Environment"
            echo ""
            echo "Python \`${{ matrix.python-version }}\` → Home Assistant \`$HA_VERSION\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run pytest
        run: pytest --cov=custom_components --cov-report=xml -q

      # setup.cfg gates the build at 85%, but the number itself appeared
      # nowhere on the pull request — so a run could sit just above the floor,
      # or drift down towards it, with nothing to notice. always() matters
      # here: the figure is most interesting on the run that just failed the
      # gate.
      - name: Summarise coverage
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          from pathlib import Path

          print("### Coverage\n")

          report = Path("coverage.xml")
          if not report.is_file():
              print("No `coverage.xml` was produced — pytest did not get that far.")
              raise SystemExit

          root = ET.parse(report).getroot()
          total = float(root.get("line-rate", 0)) * 100
          # Keep in sync with setup.cfg's [coverage:report] fail_under.
          floor = 85.0
          mark = "✅" if total >= floor else "❌"
          print(f"{mark} **{total:.1f}%** overall (floor {floor:.0f}%)\n")

          files = sorted(
              (
                  (float(c.get("line-rate", 0)) * 100, c.get("filename", "?"))
                  for c in root.iter("class")
              ),
          )
          weakest = [f for f in files if f[0] < 95.0][:5]
          if weakest:
              print("Least covered files:\n")
              print("| File | Coverage |")
              print("| --- | ---: |")
              for rate, name in weakest:
                  print(f"| `{name}` | {rate:.1f}% |")
          PY

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hacs/action@main
        with:
          category: integration
          # brands quality-scale rule is still "todo" (see quality_scale.yaml)
          # - no approved home-assistant/brands entry exists yet.
          ignore: brands

  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: home-assistant/actions/hassfest@master
