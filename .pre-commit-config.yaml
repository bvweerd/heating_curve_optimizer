repos:
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: [--py313-plus]
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args:
          - --ignore-words-list=hass,alot,datas,dof,dur,farenheit,hist,iff,ines,ist,lightsensor,mut,nd,pres,referer,ser,serie,te,technik,thirdparty,ue,uint,visability,wan,wanna,withing
          # translations/nl.json and the Dutch README section are not English.
          - --skip=./.*,*.csv,*.json,*.nl.md
          - --quiet-level=2
        exclude_types: [csv, json]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
  # Local, not mirrors-mypy: the check needs the installed Home Assistant
  # (pip install -r requirements.txt mypy), whose types an isolated hook
  # environment would not have.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy custom_components/heating_curve_optimizer
        language: system
        types: [python]
        pass_filenames: false
